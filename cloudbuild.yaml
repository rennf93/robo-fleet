# Cloud Build pipeline: build the three RoboFleet images into Artifact Registry.
# Substitutions (override via --substitutions or the env vars in build-images.sh):
#   _AR_HOST     - the regional docker.pkg.dev host, e.g. us-central1-docker.pkg.dev
#   _AR_REPO     - the Artifact Registry repo id, e.g. robo-fleet
#   _PROJECT_ID  - the GCP project id (set automatically by Cloud Build)
# Each image is tagged with both $SHORT_SHA and :latest so a deploy can pin to
# a build while :latest always points at the most recent successful build.
# Plain hyphens only, no em-dashes.

substitutions:
  _AR_HOST: ""
  _AR_REPO: ""
  _SHORT_SHA: "manual"

steps:
  - id: orchestrator
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - docker/orchestrator.Dockerfile
      - -t
      - ${_AR_HOST}/${_PROJECT_ID}/${_AR_REPO}/robofleet-orchestrator:${_SHORT_SHA}
      - -t
      - ${_AR_HOST}/${_PROJECT_ID}/${_AR_REPO}/robofleet-orchestrator:latest
      - .

  - id: panel
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - docker/panel.Dockerfile
      - -t
      - ${_AR_HOST}/${_PROJECT_ID}/${_AR_REPO}/robofleet-panel:${_SHORT_SHA}
      - -t
      - ${_AR_HOST}/${_PROJECT_ID}/${_AR_REPO}/robofleet-panel:latest
      - .

  - id: agent-adk
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - docker/agent-adk.Dockerfile
      - -t
      - ${_AR_HOST}/${_PROJECT_ID}/${_AR_REPO}/robofleet-agent-adk:${_SHORT_SHA}
      - -t
      - ${_AR_HOST}/${_PROJECT_ID}/${_AR_REPO}/robofleet-agent-adk:latest
      - .

images:
  - ${_AR_HOST}/${_PROJECT_ID}/${_AR_REPO}/robofleet-orchestrator:${_SHORT_SHA}
  - ${_AR_HOST}/${_PROJECT_ID}/${_AR_REPO}/robofleet-orchestrator:latest
  - ${_AR_HOST}/${_PROJECT_ID}/${_AR_REPO}/robofleet-panel:${_SHORT_SHA}
  - ${_AR_HOST}/${_PROJECT_ID}/${_AR_REPO}/robofleet-panel:latest
  - ${_AR_HOST}/${_PROJECT_ID}/${_AR_REPO}/robofleet-agent-adk:${_SHORT_SHA}
  - ${_AR_HOST}/${_PROJECT_ID}/${_AR_REPO}/robofleet-agent-adk:latest

options:
  logging: CLOUD_LOGGING_ONLY