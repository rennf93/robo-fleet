# Cloud Run v2 Service manifest for robofleet-panel.
# Consumed by `gcloud run services replace infra/panel-service.yaml`.
# Stateless: no Cloud SQL, Redis, or Filestore. The panel is a Next.js app;
# its Next server proxies /api/* and /ws/* to the orchestrator (next.config
# rewrites, ROBOFLEET_API_URL) and probes /auth/status server-side (proxy.ts).
# The panel does NOT carry the cloud-auth secret, email, or password: those
# are orchestrator-side (Python, JWT signing + CEO seed). The panel just
# forwards the browser's session cookie through the rewrite proxy.
# --allow-unauthenticated is set by deploy-panel.sh: the panel is a public
# UI (the login page must load), and the panel's own middleware + the
# orchestrator's cloud auth are the real gates.
# Plain hyphens only, no em-dashes.

apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: robofleet-panel
  labels:
    run.googleapis.com/managed-by: gcloud
spec:
  template:
    metadata:
      annotations:
        autoscaling.googleapis.com/min-scale: "1"
        autoscaling.googleapis.com/max-scale: "3"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
        - name: panel
          image: __AR_HOST__/__PROJECT_ID__/__AR_REPO__/robofleet-panel:latest
          ports:
            - name: http1
              containerPort: 3000
          env:
            # --- URLs ---
            # ROBOFLEET_API_URL is the orchestrator's public Cloud Run URL.
            # The deploy script fills __ORCHESTRATOR_URL__ from
            # `gcloud run services describe robofleet-orchestrator`. The Next
            # server proxies /api/* and /ws/* here (next.config rewrites) and
            # probes /auth/status here (proxy.ts).
            - name: ROBOFLEET_API_URL
              value: "__ORCHESTRATOR_URL__"
            - name: ROBOFLEET_ORCHESTRATOR_URL
              value: "__ORCHESTRATOR_URL__"
            - name: ROBOFLEET_PUBLIC_BASE_URL
              value: "__PUBLIC_BASE_URL__"